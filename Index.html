<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>همّة | تطبيق الطالب المسلم للمذاكرة وتنظيم الوقت</title>
  <meta name="description" content="تطبيق إسلامي وإنتاجي متكامل للطلاب يجمع بين إدارة المذاكرة بأسلوب بومودورو وأنكي، ومتابعة الصلوات والأذكار مع ألقاب الصحابة والمكافآت." />

  <!-- Google Fonts: Tajawal & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'sans-serif'],
            serif: ['Amiri', 'serif'],

  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // صوت تنبيه انتهاء مؤقت بومودورو عبر Web Audio API
    const playTimerSound = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.log('Audio error:', e);
      }
    };

    // البيانات الافتراضية
    const DEFAULT_TITLES = [
      { id: 't_muntahi', title: 'طالب العلم المبادر', category: 'starter', cost: 0, unlocked: true, badgeIcon: '🌱' },
      { id: 't_sayf', title: 'سيف الله المسلول', category: 'sahaba', cost: 100, unlocked: false, badgeIcon: '⚔️' },
      { id: 't_nurayn', title: 'ذو النورين', category: 'sahaba', cost: 120, unlocked: false, badgeIcon: '🕊️' },
      { id: 't_farouq', title: 'الفاروق', category: 'sahaba', cost: 150, unlocked: false, badgeIcon: '⚖️' },
      { id: 't_siddiq', title: 'الصِّدِّيق', category: 'sahaba', cost: 200, unlocked: false, badgeIcon: '⭐' },
      { id: 't_turjuman', title: 'ترجمان القرآن', category: 'sahaba', cost: 180, unlocked: false, badgeIcon: '📜' },
      { id: 't_tabib', title: 'طبيب القلوب', category: 'scholar', cost: 90, unlocked: false, badgeIcon: '🩺' },
    ];

    const DEFAULT_THEMES = [
      { id: 'emerald', name: 'الزمردي الوقور', bgClass: 'from-emerald-950 via-slate-900 to-slate-950', borderClass: 'border-emerald-500/30', accent: 'emerald', cost: 0, unlocked: true },
      { id: 'slate', name: 'الكحلي الليلي', bgClass: 'from-slate-950 via-slate-900 to-slate-950', borderClass: 'border-blue-500/30', accent: 'blue', cost: 0, unlocked: true },
      { id: 'gold', name: 'الذهبي الأندلسي', bgClass: 'from-amber-950/60 via-slate-900 to-slate-950', borderClass: 'border-amber-500/30', accent: 'amber', cost: 60, unlocked: false },
      { id: 'crimson', name: 'العنابي الملكي', bgClass: 'from-rose-950/60 via-slate-900 to-slate-950', borderClass: 'border-rose-500/30', accent: 'rose', cost: 80, unlocked: false },
    ];

    const DEFAULT_PRAYERS = [
      { id: 'fajr', name: 'الفجر', timeHint: 'قبل الشروق', completed: false, withSunnah: false },
      { id: 'dhuhr', name: 'الظهر', timeHint: 'منتصف النهار', completed: false, withSunnah: false },
      { id: 'asr', name: 'العصر', timeHint: 'بعد الظهر', completed: false, withSunnah: false },
      { id: 'maghrib', name: 'المغرب', timeHint: 'غروب الشمس', completed: false, withSunnah: false },
      { id: 'isha', name: 'العشاء', timeHint: 'دخول الليل', completed: false, withSunnah: false },
    ];

    const DEFAULT_ATHKAR = [
      { id: 'a1', title: 'دعاء استفتاح المذاكرة والفهم', text: 'اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلًا.', count: 0, target: 1, completed: false },
      { id: 'a2', title: 'دعاء تثبيت العلم بعد المذاكرة', text: 'اللَّهُمَّ إِنِّي أَسْتَوْدِعُكَ مَا قَرَأْتُ وَمَا حَفِظْتُ فَرُدَّهُ عَلَيَّ عِنْدَ حَاجَتِي إِلَيْهِ.', count: 0, target: 1, completed: false },
      { id: 'a3', title: 'الصلاة الإبراهيمية على النبي ﷺ', text: 'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ.', count: 0, target: 10, completed: false },
      { id: 'a4', title: 'سيد الاستغفار والتيسير', text: 'أَسْتَغْفِرُ اللَّهَ العَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الحَيُّ القَيُّومُ وَأَتُوبُ إِلَيْهِ.', count: 0, target: 33, completed: false },
    ];

    const DEFAULT_TASKS = [
      { id: 1, text: 'مراجعة أول فصلين في الفيزياء', priority: 'high', completed: false },
      { id: 2, text: 'حل بنك أسئلة الرياضيات (15 مسألة)', priority: 'medium', completed: false },
      { id: 3, text: 'تلخيص درس التاريخ بخرائط ذهنية', priority: 'low', completed: true },
    ];

    const DEFAULT_CARDS = [
      { id: 1, question: 'ما هو قانون نيوتن الثاني للحركة؟', answer: 'القوة المحصلة المؤثرة على جسم تساوي كتلته مضروبة في تسارعه (F = m × a).', subject: 'فيزياء', interval: 1 },
      { id: 2, question: 'من هو الصحابي الجليل الملقب بأمين هذه الأمة؟', answer: 'أبو عبيدة عامر بن الجراح رضي الله عنه.', subject: 'إسلاميات', interval: 3 },
      { id: 3, question: 'ما هي عاصمة الدولة الأموية؟', answer: 'دمشق، سوريا.', subject: 'تاريخ', interval: 2 },
    ];

    function HimmaApp() {
      // استرجاع البيانات من LocalStorage
      const [coins, setCoins] = useState(() => Number(localStorage.getItem('himma_coins') || '150'));
      const [userName, setUserName] = useState(() => localStorage.getItem('himma_user') || 'طالب الهمّة');
      const [activeTab, setActiveTab] = useState('study');
      const [streakDays, setStreakDays] = useState(5);
      const [toast, setToast] = useState(null);

      const [titles, setTitles] = useState(() => {
        const saved = localStorage.getItem('himma_titles');
        return saved ? JSON.parse(saved) : DEFAULT_TITLES;
      });
      const [activeTitleId, setActiveTitleId] = useState(() => localStorage.getItem('himma_active_title') || 't_muntahi');

      const [themes, setThemes] = useState(() => {
        const saved = localStorage.getItem('himma_themes');
        return saved ? JSON.parse(saved) : DEFAULT_THEMES;
      });
      const [activeThemeId, setActiveThemeId] = useState(() => localStorage.getItem('himma_active_theme') || 'emerald');

      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('himma_tasks');
        return saved ? JSON.parse(saved) : DEFAULT_TASKS;
      });
      const [newTaskText, setNewTaskText] = useState('');
      const [newTaskPriority, setNewTaskPriority] = useState('medium');

      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem('himma_cards');
        return saved ? JSON.parse(saved) : DEFAULT_CARDS;
      });
      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const [pomoMode, setPomoMode] = useState('work');
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [isRunning, setIsRunning] = useState(false);

      const [prayers, setPrayers] = useState(() => {
        const saved = localStorage.getItem('himma_prayers');
        return saved ? JSON.parse(saved) : DEFAULT_PRAYERS;
      });
      const [athkar, setAthkar] = useState(() => {
        const saved = localStorage.getItem('himma_athkar');
        return saved ? JSON.parse(saved) : DEFAULT_ATHKAR;
      });
      const [tasbeehCount, setTasbeehCount] = useState(0);
      const [tasbeehPhrase, setTasbeehPhrase] = useState('سُبْحَانَ اللَّهِ وَبِحَمْدِهِ');

      useEffect(() => { localStorage.setItem('himma_coins', coins.toString()); }, [coins]);
      useEffect(() => { localStorage.setItem('himma_user', userName); }, [userName]);
      useEffect(() => { localStorage.setItem('himma_titles', JSON.stringify(titles)); }, [titles]);
      useEffect(() => { localStorage.setItem('himma_active_title', activeTitleId); }, [activeTitleId]);
      useEffect(() => { localStorage.setItem('himma_themes', JSON.stringify(themes)); }, [themes]);
      useEffect(() => { localStorage.setItem('himma_active_theme', activeThemeId); }, [activeThemeId]);
      useEffect(() => { localStorage.setItem('himma_tasks', JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem('himma_cards', JSON.stringify(cards)); }, [cards]);
      useEffect(() => { localStorage.setItem('himma_prayers', JSON.stringify(prayers)); }, [prayers]);
      useEffect(() => { localStorage.setItem('himma_athkar', JSON.stringify(athkar)); }, [athkar]);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => {
        let timer = null;
        if (isRunning && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (isRunning && timeLeft === 0) {
          setIsRunning(false);
          playTimerSound();
          if (pomoMode === 'work') {
            setCoins(prev => prev + 15);
            showToast('أنهيت جلسة التركيز وحصلت على +15 عملة 🪙', 'reward');
          } else {
            showToast('انتهت الاستراحة! استعن بالله وابدأ جلسة التركيز القادمة ✨', 'success');
          }
        }
        return () => clearInterval(timer);
      }, [isRunning, timeLeft, pomoMode]);

      const switchPomoMode = (mode) => {
        setIsRunning(false);
        setPomoMode(mode);
        if (mode === 'work') setTimeLeft(25 * 60);
        else if (mode === 'short') setTimeLeft(5 * 60);
        else if (mode === 'long') setTimeLeft(15 * 60);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const toggleTask = (id) => {
        setTasks(prev => prev.map(t => {
          if (t.id === id) {
            const nextCompleted = !t.completed;
            if (nextCompleted) {
              setCoins(c => c + 5);
              showToast('أتممت مهمة دراسية (+5 عملات) 🪙', 'reward');
            }
            return { ...t, completed: nextCompleted };
          }
          return t;
        }));
      };

      const addTask = (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;
        setTasks([{ id: Date.now(), text: newTaskText.trim(), priority: newTaskPriority, completed: false }, ...tasks]);
        setNewTaskText('');
        showToast('تمت إضافة المهمة بنجاح ✓', 'success');
      };

      const togglePrayer = (id) => {
        setPrayers(prev => prev.map(p => {
          if (p.id === id) {
            const next = !p.completed;
            if (next) {
              setCoins(c => c + 10);
              showToast('تقبل الله صلاتك! (+10 عملات) 🕌', 'reward');
            }
            return { ...p, completed: next };
          }
          return p;
        }));
      };

      const togglePrayerSunnah = (id) => {
        setPrayers(prev => prev.map(p => {
          if (p.id === id) {
            const next = !p.withSunnah;
            if (next) {
              setCoins(c => c + 5);
              showToast('أتممت السنن الرواتب! (+5 عملات) ✨', 'reward');
            }
            return { ...p, withSunnah: next };
          }
          return p;
        }));
      };

      const handleDhikrClick = (id) => {
        setAthkar(prev => prev.map(a => {
          if (a.id === id) {
            const nextCount = a.count + 1;
            const completed = nextCount >= a.target;
            if (completed && !a.completed) {
              setCoins(c => c + 8);
              showToast('تم إتمام الذكر! (+8 عملات بركة) 📿', 'reward');
            }
            return { ...a, count: nextCount, completed };
          }
          return a;
        }));
      };

      const buyOrEquipTitle = (t) => {
        if (t.unlocked) {
          setActiveTitleId(t.id);
          showToast(`تم تفعيل اللقب: ${t.title} 🏅`, 'success');
        } else {
          if (coins >= t.cost) {
            setCoins(c => c - t.cost);
            setTitles(prev => prev.map(item => item.id === t.id ? { ...item, unlocked: true } : item));
            setActiveTitleId(t.id);
            showToast(`مبروك! اشتريت وفعلت لقب ${t.title} ⚔️`, 'reward');
          } else {
            showToast(`عفواً، ليس لديك عملات كافية (${t.cost} عملة مطلوبة)`, 'warning');
          }
        }
      };

      const buyOrEquipTheme = (th) => {
        if (th.unlocked) {
          setActiveThemeId(th.id);
          showToast(`تم تفعيل مظهر: ${th.name} 🎨`, 'success');
        } else {
          if (coins >= th.cost) {
            setCoins(c => c - th.cost);
            setThemes(prev => prev.map(item => item.id === th.id ? { ...item, unlocked: true } : item));
            setActiveThemeId(th.id);
            showToast(`تم شراء وتفعيل مظهر ${th.name}!`, 'reward');
          } else {
            showToast(`ليس لديك عملات كافية (${th.cost} عملة مطلوبة)`, 'warning');
          }
        }
      };

      const currentTheme = themes.find(th => th.id === activeThemeId) || themes[0];
      const currentTitle = titles.find(t => t.id === activeTitleId) || titles[0];

      return (
        <div className={`min-h-screen bg-gradient-to-b ${currentTheme.bgClass} text-slate-100 flex flex-col items-center p-3 sm:p-6 transition-colors duration-500`}>
          <div className="w-full max-w-3xl rounded-3xl border border-white/10 bg-slate-950/70 shadow-2xl backdrop-blur-xl overflow-hidden">
            
            {/* Header */}
            <header className="p-4 sm:p-5 border-b border-white/10 bg-black/30">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 text-slate-950 flex items-center justify-center font-black text-xl shadow-lg shadow-amber-500/20">
                    هـ
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-black text-base sm:text-lg text-white">تطبيق همّة</span>
                      <span className="text-[10px] bg-amber-400/20 text-amber-300 font-bold px-2 py-0.5 rounded-full border border-amber-400/30">
                        للطالب المسلم
                      </span>
                    </div>
                    <div className="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                      <span>السلام عليكم،</span>
                      <input 
                        value={userName} 
                        onChange={(e) => setUserName(e.target.value)} 
                        className="bg-transparent border-b border-white/20 text-slate-200 text-xs font-bold focus:outline-none focus:border-amber-400 max-w-[120px]"
                        title="انقر لتعديل اسمك"
                      />
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-2.5">
                  <div 
                    onClick={() => setActiveTab('store')}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-2xl bg-amber-500/15 border border-amber-500/30 text-amber-300 font-black text-xs sm:text-sm cursor-pointer hover:bg-amber-500/25 transition-all"
                  >
                    <span>🪙</span>
                    <span>{coins.toLocaleString('ar-EG')}</span>
                    <span className="text-[10px] text-amber-400/80 font-normal">عملة</span>
                  </div>

                  <div className="flex items-center gap-1 px-3 py-1.5 rounded-2xl bg-orange-500/15 border border-orange-500/30 text-orange-400 font-bold text-xs">
                    <span>🔥</span>
                    <span>{streakDays} أيام همّة</span>
                  </div>
                </div>
              </div>

              <div className="mt-3.5 flex items-center gap-2 p-2 px-3 rounded-xl bg-white/[0.03] border border-white/5 text-xs text-amber-200">
                <span className="text-amber-400 font-bold">اللقب المفعل:</span>
                <span className="font-black text-amber-300">{currentTitle.title}</span>
                <span>{currentTitle.badgeIcon}</span>
                <button onClick={() => setActiveTab('store')} className="mr-auto text-[10px] text-slate-400 hover:text-amber-300 underline">
                  تغيير من المتجر
                </button>
              </div>

              <nav className="flex items-center gap-2 mt-4 bg-black/40 p-1.5 rounded-2xl border border-white/5">
                <button
                  onClick={() => setActiveTab('study')}
                  className={`flex-1 py-2 rounded-xl text-xs sm:text-sm font-black transition-all flex items-center justify-center gap-1.5 ${
                    activeTab === 'study' ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>📚</span>
                  <span>المذاكرة والإنتاجية</span>
                </button>
                <button
                  onClick={() => setActiveTab('deen')}
                  className={`flex-1 py-2 rounded-xl text-xs sm:text-sm font-black transition-all flex items-center justify-center gap-1.5 ${
                    activeTab === 'deen' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>🌙</span>
                  <span>الدين والروحانيات</span>
                </button>
                <button
                  onClick={() => setActiveTab('store')}
                  className={`flex-1 py-2 rounded-xl text-xs sm:text-sm font-black transition-all flex items-center justify-center gap-1.5 ${
                    activeTab === 'store' ? 'bg-purple-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>🛍️</span>
                  <span>المتجر والتخصيص</span>
                </button>
              </nav>
            </header>

            {/* Main Content */}
            <main className="p-4 sm:p-6 space-y-6">
              {/* تبويب المذاكرة */}
              {activeTab === 'study' && (
                <div className="space-y-6">
                  {/* بومودورو */}
                  <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10 text-center">
                    <div className="flex justify-center gap-2 mb-4">
                      <button onClick={() => switchPomoMode('work')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${pomoMode === 'work' ? 'bg-amber-500 text-slate-950' : 'bg-white/5 text-slate-400'}`}>تركيز (25 د)</button>
                      <button onClick={() => switchPomoMode('short')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${pomoMode === 'short' ? 'bg-emerald-500 text-slate-950' : 'bg-white/5 text-slate-400'}`}>راحة (5 د)</button>
                      <button onClick={() => switchPomoMode('long')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${pomoMode === 'long' ? 'bg-blue-500 text-slate-950' : 'bg-white/5 text-slate-400'}`}>راحة (15 د)</button>
                    </div>
                    <div className="text-5xl sm:text-6xl font-black tracking-widest text-white font-mono my-2 drop-shadow-md">{formatTime(timeLeft)}</div>
                    <p className="text-xs text-slate-400 mb-5">«استعن بالله ولا تعجز» - اكتم المشتتات وركز لنيل المكافأة (+15 عملة)</p>
                    <div className="flex items-center justify-center gap-3">
                      <button onClick={() => setIsRunning(!isRunning)} className={`px-6 py-2.5 rounded-2xl font-black text-sm shadow-lg ${isRunning ? 'bg-rose-500 text-white' : 'bg-amber-500 text-slate-950'}`}>
                        {isRunning ? 'إيقاف مؤقت ⏸️' : 'ابدأ التركيز ▶️'}
                      </button>
                      <button onClick={() => switchPomoMode(pomoMode)} className="px-4 py-2.5 rounded-2xl bg-white/10 hover:bg-white/20 text-slate-300 text-sm font-bold">إعادة تعيين ↺</button>
                    </div>
                  </div>

                  {/* المهام */}
                  <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10">
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="font-black text-white text-base">✅ قائمة المهام والواجبات</h3>
                      <span className="text-xs font-bold text-amber-300 bg-amber-500/15 px-2.5 py-1 rounded-full border border-amber-500/20">
                        {tasks.filter(t => t.completed).length} / {tasks.length} مكتمل
                      </span>
                    </div>
                    <form onSubmit={addTask} className="flex gap-2 mb-4">
                      <input type="text" placeholder="أضف مهمة دراسية جديدة..." value={newTaskText} onChange={(e) => setNewTaskText(e.target.value)} className="flex-1 bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none" />
                      <select value={newTaskPriority} onChange={(e) => setNewTaskPriority(e.target.value)} className="bg-black/40 border border-white/10 rounded-xl px-2 py-2 text-xs text-slate-300">
                        <option value="high">عالية</option>
                        <option value="medium">متوسطة</option>
                        <option value="low">عادية</option>
                      </select>
                      <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-black rounded-xl text-xs">إضافة</button>
                    </form>
                    <div className="space-y-2">
                      {tasks.map(task => (
                        <div key={task.id} className={`flex items-center justify-between p-3 rounded-xl border ${task.completed ? 'bg-white/[0.01] border-white/5 opacity-60' : 'bg-white/[0.04] border-white/10'}`}>
                          <div className="flex items-center gap-3">
                            <input type="checkbox" checked={task.completed} onChange={() => toggleTask(task.id)} className="w-4 h-4 accent-amber-500 cursor-pointer rounded" />
                            <span className={`text-xs sm:text-sm font-medium ${task.completed ? 'line-through text-slate-500' : 'text-white'}`}>{task.text}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* أنكي فلاش كاردز */}
                  <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10">
                    <h3 className="font-black text-white text-base mb-3">🧠 بطاقات الاستذكار السريع (نظام أنكي)</h3>
                    {cards.length > 0 && (
                      <div>
                        <div onClick={() => setIsFlipped(!isFlipped)} className={`min-h-[160px] p-6 rounded-2xl border flex flex-col items-center justify-center text-center cursor-pointer transition-all shadow-xl ${isFlipped ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-100' : 'bg-black/40 border-white/15 text-white'}`}>
                          <span className="text-[11px] font-bold text-slate-400 mb-2">{cards[cardIndex].subject} • {isFlipped ? 'الإجابة:' : 'السؤال (انقر للكشف):'}</span>
                          <p className="text-sm sm:text-base font-bold leading-relaxed">{isFlipped ? cards[cardIndex].answer : cards[cardIndex].question}</p>
                        </div>
                        <div className="flex items-center justify-between mt-4">
                          <button onClick={() => { setIsFlipped(false); setCardIndex((prev) => (prev > 0 ? prev - 1 : cards.length - 1)); }} className="px-3 py-1.5 rounded-xl bg-white/5 text-xs font-bold">السابق ‹</button>
                          <button onClick={() => { setCoins(c => c + 2); showToast('تم الحفظ بنجاح! (+2 عملة)', 'reward'); setIsFlipped(false); setCardIndex((prev) => (prev + 1) % cards.length); }} className="px-3 py-1.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs font-bold">حفظت السؤال ✓</button>
                          <button onClick={() => { setIsFlipped(false); setCardIndex((prev) => (prev + 1) % cards.length); }} className="px-3 py-1.5 rounded-xl bg-white/5 text-xs font-bold">التالي ›</button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* تبويب الدين */}
              {activeTab === 'deen' && (
                <div className="space-y-6">
                  <div className="p-5 rounded-2xl bg-gradient-to-r from-emerald-950/40 via-teal-900/20 to-slate-900 border border-emerald-500/30 text-center">
                    <p className="text-base font-bold text-amber-300 font-serif">﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾</p>
                    <p className="text-xs text-slate-300 mt-1">"من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة."</p>
                  </div>

                  {/* الصلوات */}
                  <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10">
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="font-black text-white text-base">🕌 الصلوات الخمس اليومية</h3>
                      <span className="text-xs font-bold text-emerald-400 bg-emerald-500/15 px-2.5 py-1 rounded-full border border-emerald-500/30">
                        {prayers.filter(p => p.completed).length} / 5 صلوات
                      </span>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                      {prayers.map(p => (
                        <div key={p.id} onClick={() => togglePrayer(p.id)} className={`p-3 rounded-2xl border cursor-pointer flex sm:flex-col items-center justify-between sm:justify-center text-center gap-2 ${p.completed ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-200' : 'bg-white/[0.02] border-white/10'}`}>
                          <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-black ${p.completed ? 'bg-emerald-500 text-slate-950' : 'bg-white/10 text-slate-300'}`}>{p.completed ? '✓' : p.name[0]}</div>
                          <div className="text-xs font-black text-white">{p.name}</div>
                          <button type="button" onClick={(e) => { e.stopPropagation(); togglePrayerSunnah(p.id); }} className={`text-[10px] px-2 py-0.5 rounded-full border ${p.withSunnah ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-white/5 text-slate-400 border-white/10'}`}>
                            {p.withSunnah ? 'السنن ✓' : '+ السنن'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* الأذكار */}
                  <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10">
                    <h3 className="font-black text-white text-base mb-3">📿 أدعية المذاكرة وتيسير الفهم</h3>
                    <div className="space-y-3">
                      {athkar.map(item => (
                        <div key={item.id} className={`p-3.5 rounded-xl border flex items-start justify-between gap-3 ${item.completed ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-white/[0.02] border-white/10'}`}>
                          <div>
                            <div className="text-xs font-bold text-teal-300 mb-1">{item.title}</div>
                            <p className="text-xs sm:text-sm text-slate-100 font-serif leading-relaxed">{item.text}</p>
                          </div>
                          <button onClick={() => handleDhikrClick(item.id)} className={`px-3 py-1.5 rounded-xl text-xs font-black shrink-0 ${item.completed ? 'bg-emerald-500 text-slate-950' : 'bg-teal-500/20 text-teal-300 border border-teal-500/40'}`}>
                            {item.completed ? 'تم الإتمام ✓' : `${item.count} / ${item.target}`}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* السبحة */}
                  <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10 text-center">
                    <h3 className="font-black text-white text-base mb-3">السبحة الإلكترونية</h3>
                    <div className="flex justify-center gap-2 mb-4 flex-wrap">
                      {['سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', 'أَسْتَغْفِرُ اللَّهَ العَظِيمَ', 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ'].map(phrase => (
                        <button key={phrase} onClick={() => setTasbeehPhrase(phrase)} className={`px-2.5 py-1 rounded-xl text-xs font-bold ${tasbeehPhrase === phrase ? 'bg-amber-500 text-slate-950' : 'bg-white/5 text-slate-400'}`}>
                          {phrase}
                        </button>
                      ))}
                    </div>
                    <div onClick={() => setTasbeehCount(prev => prev + 1)} className="w-32 h-32 mx-auto my-3 rounded-full border-4 border-amber-500/40 bg-gradient-to-tr from-amber-500/20 to-transparent flex flex-col items-center justify-center cursor-pointer active:scale-95 shadow-xl select-none">
                      <span className="text-3xl font-black text-amber-300 font-mono">{tasbeehCount}</span>
                      <span className="text-[10px] text-slate-400">انقر للتسبيح</span>
                    </div>
                    <button onClick={() => setTasbeehCount(0)} className="text-xs text-slate-500 hover:text-slate-300 underline">تصفير العداد</button>
                  </div>
                </div>
              )}

              {/* تبويب المتجر */}
              {activeTab === 'store' && (
                <div className="space-y-6">
                  <div className="p-5 rounded-2xl bg-gradient-to-r from-purple-950/40 via-purple-900/20 to-slate-900 border border-purple-500/30 flex items-center justify-between">
                    <div>
                      <h3 className="font-black text-white text-base">متجر ألقاب الصحابة والمظاهر</h3>
                      <p className="text-xs text-purple-300/80">استبدل عملات إنجازك بألقاب تاريخية</p>
                    </div>
                    <div className="text-sm font-black text-amber-300 bg-amber-500/20 px-3 py-1 rounded-xl border border-amber-500/30">🪙 {coins} عملة</div>
                  </div>

                  {/* الألقاب */}
                  <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10">
                    <h3 className="font-black text-white text-base mb-3">🎖️ ألقاب الصحابة والعلماء</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {titles.map(t => (
                        <div key={t.id} className={`p-3.5 rounded-2xl border flex items-center justify-between ${activeTitleId === t.id ? 'bg-amber-500/15 border-amber-500/50' : t.unlocked ? 'bg-white/[0.03] border-white/15' : 'bg-black/40 border-white/5 opacity-80'}`}>
                          <div className="flex items-center gap-2.5">
                            <span className="text-2xl">{t.badgeIcon}</span>
                            <div>
                              <div className="text-xs font-black text-white">{t.title}</div>
                              <div className="text-[10px] text-slate-400">{t.unlocked ? (activeTitleId === t.id ? 'اللقب المفعل' : 'مملوك') : `${t.cost} عملة`}</div>
                            </div>
                          </div>
                          <button onClick={() => buyOrEquipTitle(t)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTitleId === t.id ? 'bg-amber-500 text-slate-950' : t.unlocked ? 'bg-white/10 text-white' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}`}>
                            {activeTitleId === t.id ? 'مفعّل ✓' : t.unlocked ? 'تفعيل' : 'شراء 🪙'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* المظاهر */}
                  <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10">
                    <h3 className="font-black text-white text-base mb-3">🎨 ألوان ومظاهر التطبيق</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {themes.map(th => (
                        <div key={th.id} className={`p-3.5 rounded-2xl border flex items-center justify-between ${activeThemeId === th.id ? 'bg-white/10 border-amber-400' : 'bg-white/[0.02] border-white/10'}`}>
                          <div className="text-xs font-black text-white">{th.name}</div>
                          <button onClick={() => buyOrEquipTheme(th)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeThemeId === th.id ? 'bg-amber-500 text-slate-950' : th.unlocked ? 'bg-white/10 text-white' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}`}>
                            {activeThemeId === th.id ? 'مفعّل ✓' : th.unlocked ? 'تفعيل' : 'شراء 🪙'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </main>

            <footer className="p-4 border-t border-white/10 bg-black/40 text-center text-xs text-slate-500">
              همّة © 2026 - رفيق الطالب المسلم للمذاكرة والنجاح
            </footer>
          </div>

          {toast && (
            <div className={`fixed bottom-5 z-50 px-4 py-3 rounded-2xl shadow-2xl backdrop-blur-xl border flex items-center gap-2 animate-bounce ${toast.type === 'reward' ? 'bg-amber-950/90 border-amber-500 text-amber-200' : 'bg-emerald-950/90 border-emerald-500 text-emerald-200'}`}>
              <span>{toast.type === 'reward' ? '🪙' : '✨'}</span>
              <span className="text-xs font-bold">{toast.msg}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HimmaApp />);
  </script>
</body>
</html>
